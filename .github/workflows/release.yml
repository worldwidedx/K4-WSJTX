name: Release K4-WSJT-X

on:
  workflow_call:
    inputs:
      candidate_tag:
        description: "Immutable internal tag (build/vX.Y.Z or build/vX.Y.Z-rcN)"
        required: true
        type: string
      expected_sha:
        description: "Full commit SHA selected by the release tag helper"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-candidate-${{ inputs.candidate_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release_channel: ${{ steps.identity.outputs.channel }}
      rc_number: ${{ steps.identity.outputs.rc_number }}
      windows_signing: ${{ steps.identity.outputs.windows_signing }}
      linux_image_tag: ${{ steps.linux-image.outputs.image_tag }}
      armhf_image_tag: ${{ steps.armhf-image.outputs.image_tag }}
    env:
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#build/v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_CHANNEL=GA
            RC_NUMBER=""
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc([1-9][0-9]*)$ ]]; then
            RELEASE_CHANNEL=RC
            RC_NUMBER="${BASH_REMATCH[1]}"
          else
            echo "::error::Supported release tags are build/vX.Y.Z and build/vX.Y.Z-rcN."
            exit 1
          fi
          {
            echo "version=$(jq -r .version <<<"$IDENTITY")"
            echo "channel=$(jq -r .channel <<<"$IDENTITY")"
            echo "rc_number=$(jq -r .rc_number <<<"$IDENTITY")"
            echo "windows_signing=$(jq -r .windows_signing <<<"$IDENTITY")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag and project versions match
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#build/v}"
          TAG_NUMERIC="${TAG_VERSION%%-*}"
          CMAKE_VERSION=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9][0-9.]*).*/\1/p' CMakeLists.txt | head -1)
          CMAKE_NUMERIC=$(echo "$CMAKE_VERSION" | awk -F. '{printf "%s.%s.%s", $1, $2, $3}')
          if [ "$TAG_NUMERIC" != "$CMAKE_NUMERIC" ]; then
            echo "::error::Tag version $TAG_NUMERIC does not match CMake version $CMAKE_NUMERIC."
            exit 1
          fi

  macos-arm64-qt:
    needs: prepare
    uses: ./.github/workflows/prepare-macos-qt.yml
    with:
      arch: arm64
      runner: macos-15
      deployment_target: "11.0"

  macos-intel-qt:
    needs: prepare
    uses: ./.github/workflows/prepare-macos-qt.yml
    with:
      arch: x86_64
      runner: macos-15-intel
      deployment_target: "10.13"

  macos:
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: arm64
      runner: macos-15
      deployment_target: "11.0"
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}
      signing_mode: validation

  macos-intel:
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: x86_64
      runner: macos-15-intel
      deployment_target: "10.13"
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}
    secrets: inherit

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: x86_64
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}

  linux-arm:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.1"
      arch: aarch64
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"
      release_channel: ${{ needs.prepare.outputs.release_channel }}
      rc_number: ${{ needs.prepare.outputs.rc_number }}

  release:
    needs: [prepare, macos, macos-intel, linux, linux-arm, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build source archive for general releases
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ inputs.expected_sha }}
          WINDOWS_RELEASE_MODE: ${{ needs.prepare.outputs.windows_signing }}
        run: |
          git archive \
            --format=tar.gz \
            --prefix="K4-WSJT-X-${VERSION}/" \
            -o "artifacts/K4-WSJT-X-${VERSION}-src.tar.gz" \
            "${GITHUB_REF_NAME}"

      - name: Verify all platform installers
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          labels=(
            "macOS arm64 .pkg"
            "macOS x86_64 .pkg"
            "Linux x86_64 AppImage"
            "Linux aarch64 AppImage"
            "Windows x86_64 installer"
          )
          patterns=(
            "artifacts/K4-WSJT-X-${VERSION}-arm64-macOS.pkg/*.pkg"
            "artifacts/K4-WSJT-X-${VERSION}-x86_64-macOS.pkg/*.pkg"
            "artifacts/K4-WSJT-X-${VERSION}-linux-x86_64-AppImage/*.AppImage"
            "artifacts/K4-WSJT-X-${VERSION}-linux-aarch64-AppImage/*.AppImage"
            "artifacts/K4-WSJT-X-${VERSION}-windows-x86_64-installer/*.exe"
          )
          missing=0
          for i in "${!labels[@]}"; do
            # shellcheck disable=SC2206
            matches=( ${patterns[$i]} )
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::Missing ${labels[$i]} (${patterns[$i]})"
              missing=$((missing + 1))
            else
              printf 'ok: %-28s %s\n' "${labels[$i]}" "${matches[0]}"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to publish a partial K4-WSJT-X release."
            exit 1
          fi

      - name: Publish release to worldwidedx/K4-WSJTX
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t files < <(find artifacts -maxdepth 2 -type f \
            \( -name "*.pkg" -o -name "*.AppImage" -o -name "*.deb" \
               -o -name "*.exe" -o -name "*.tar.gz" -o -name "*.rpm" \))
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "K4-WSJT-X ${{ needs.prepare.outputs.version }}" \
            --generate-notes \
            "${prerelease[@]}" \
            "${files[@]}"
